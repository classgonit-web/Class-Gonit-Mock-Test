
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Gonit - Chapters</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#071426;
 color:white;
}
header{
 background:#10243c;
 padding:15px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:13px;
 border-bottom:2px solid #35d6c0;
}
.logo{
 width:65px;
 height:65px;
 object-fit:contain;
 border-radius:50%;
}
header h1{color:#35d6c0;margin:0 0 5px;font-size:23px}
header p{margin:0;color:#bdcce0;font-size:13px}
.container{max-width:850px;margin:auto;padding:22px 16px}
.home-link{
 color:#35d6c0;
 text-decoration:none;
 font-weight:bold;
 display:inline-block;
 margin-bottom:20px;
}
.heading{text-align:center;margin-bottom:25px}
.heading h2{color:#35d6c0;font-size:26px}
.heading p{color:#bdcce0}
.chapter-list{display:grid;gap:12px}
.chapter{
 background:#10243c;
 border:1px solid #294766;
 padding:17px;
 border-radius:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.chapter span{font-size:16px}
.chapter a{
 background:#35d6c0;
 color:#071426;
 text-decoration:none;
 font-weight:bold;
 padding:10px 14px;
 border-radius:8px;
 white-space:nowrap;
}
footer{text-align:center;padding:25px;color:#9fb2c9;font-size:13px}
@media(max-width:480px){
 header h1{font-size:19px}
 .chapter{padding:13px;align-items:flex-start}
 .chapter span{font-size:14px;line-height:1.5}
 .chapter a{font-size:12px;padding:9px}
 .heading h2{font-size:22px}
}
</style>
</head>

<body>

<header>
 <img src="logo.png" alt="Class Gonit Logo" class="logo">
 <div>
  <h1>ক্লাস গণিত 🎓</h1>
  <p>Learn • Practice • Succeed</p>
 </div>
</header>

<div class="container">

<a href="index.html" class="home-link">← Back to Home</a>

<div class="heading">
 <h2 id="sectionTitle">📚 Chapters</h2>
 <p>Select a chapter to start your mock test.</p>
</div>

<div class="chapter-list" id="chapterList"></div>

</div>

<footer>
© 2026 ক্লাস গণিত 🎓 | All Rights Reserved
</footer>

<script>
const chapters={
 Arithmetic:[
 "Number System","Simplification","BODMAS Rule",
 "HCF and LCM","Percentage","Ratio and Proportion",
 "Average","Profit and Loss","Simple Interest",
 "Compound Interest","Time and Work",
 "Time Speed and Distance","Partnership",
 "Mixture and Alligation","Problems on Ages"
 ],
 Algebra:[
 "Basic Algebra","Algebraic Identities",
 "Linear Equations","Quadratic Equations",
 "Polynomials","Surds and Indices"
 ],
 Geometry:[
 "Basic Geometry","Lines and Angles",
 "Triangles","Quadrilaterals","Circles","Polygons"
 ],
 Mensuration:[
 "2D Mensuration","Area and Perimeter",
 "3D Mensuration","Volume","Surface Area"
 ]
};

const params=new URLSearchParams(window.location.search);
const section=params.get("section")||"Arithmetic";

document.getElementById("sectionTitle").textContent=
"📚 "+section+" Chapters";

const list=document.getElementById("chapterList");

if(chapters[section]){
 chapters[section].forEach((chapter,index)=>{
  const item=document.createElement("div");
  item.className="chapter";

  const name=document.createElement("span");
  name.textContent=(index+1)+". "+chapter;

  const link=document.createElement("a");
  link.textContent="Start Test →";
  link.href="test.html?section="+encodeURIComponent(section)+
  "&chapter="+encodeURIComponent(chapter);

  item.appendChild(name);
  item.appendChild(link);
  list.appendChild(item);
 });
}else{
 list.textContent="Section not found. Please go back and choose a section.";
}
</script>

</body>
</html>
