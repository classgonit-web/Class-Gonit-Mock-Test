
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Test | ক্লাস গণিত</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    background:#081426;
    color:#f1f5f9;
    font-family:Arial,sans-serif;
    margin:0;
}
.container {
    max-width:850px;
    margin:auto;
    padding:20px;
}
.header-box {
    background:linear-gradient(135deg,#102b46,#075e65);
    padding:25px;
    text-align:center;
    border-radius:16px;
}
.header-box h1 {color:#5eead4;}
.timer {
    background:#123047;
    color:#5eead4;
    padding:15px;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    border-radius:12px;
    margin:20px 0;
}
.question {
    background:#12243a;
    border:1px solid #24506a;
    padding:18px;
    border-radius:12px;
    margin-bottom:16px;
}
.question h3 {color:#5eead4;}
.option {
    display:block;
    background:#1b3048;
    padding:12px;
    margin:9px 0;
    border-radius:8px;
    cursor:pointer;
}
.option input {margin-right:9px;}
.submit-btn {
    width:100%;
    padding:15px;
    background:#0d9488;
    color:white;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
.result {
    display:none;
    background:#123047;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}
.explanation {
    background:#12243a;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
}
.back {
    color:#5eead4;
    display:inline-block;
    margin-bottom:15px;
    text-decoration:none;
}
</style>
</head>

<body>
<div class="container">

<a class="back" href="chapters.html">← Back to Chapters</a>

<div class="header-box">
<h1>ক্লাস গণিত 🎓</h1>
<h2 id="chapterTitle">Mathematics Mock Test</h2>
<p>Practice • Learn • Improve</p>
<p>20 Questions | 20 Minutes</p>
</div>

<div class="timer">
Time Left: <span id="timer">20:00</span>
</div>

<div id="quiz"></div>

<button class="submit-btn" id="submitBtn" onclick="submitTest()">
Submit Test
</button>

<div class="result" id="result"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const section = params.get("section") || "Arithmetic";
const chapter = params.get("chapter") || "Practice Test";

document.getElementById("chapterTitle").textContent =
    chapter + " - Mock Test";

const questionBank = {
    "BODMAS Rule": [
        ["12 + 8 × 2", ["40","28","32","20"], 1, "Multiplication first: 12 + 16 = 28."],
        ["36 ÷ 6 + 4", ["10","6","12","8"], 0, "36 ÷ 6 = 6, then 6 + 4 = 10."],
        ["20 - 4 × 3", ["48","8","16","12"], 1, "4 × 3 = 12, then 20 - 12 = 8."],
        ["(10 + 5) × 2", ["20","25","30","35"], 2, "Brackets first: 15 × 2 = 30."],
        ["48 ÷ (4 × 2)", ["6","12","8","4"], 0, "4 × 2 = 8, then 48 ÷ 8 = 6."],
        ["7 + 3 × 5", ["50","22","35","25"], 1, "3 × 5 = 15, then 7 + 15 = 22."],
        ["100 - 20 ÷ 5", ["16","80","96","20"], 2, "20 ÷ 5 = 4, then 100 - 4 = 96."],
        ["(8 + 4) ÷ 3", ["3","4","5","6"], 1, "12 ÷ 3 = 4."],
        ["5 × 6 - 10", ["20","40","15","25"], 0, "30 - 10 = 20."],
        ["72 ÷ 8 × 2", ["4.5","9","18","36"], 2, "Division and multiplication from left to right: 9 × 2 = 18."],
        ["15 + 5 × 4", ["80","35","60","40"], 1, "15 + 20 = 35."],
        ["(18 - 6) ÷ 4", ["2","3","4","6"], 1, "12 ÷ 4 = 3."],
        ["9 × (7 - 3)", ["36","27","40","63"], 0, "9 × 4 = 36."],
        ["64 ÷ 8 + 7", ["8","15","16","9"], 1, "8 + 7 = 15."],
        ["50 - 6 × 5", ["20","220","44","30"], 0, "50 - 30 = 20."],
        ["(6 + 2) × (5 - 2)", ["18","24","20","16"], 1, "8 × 3 = 24."],
        ["81 ÷ 9 + 11", ["9","18","20","22"], 1, "9 + 11 = 20."],
        ["4 × 5 + 6 ÷ 2", ["23","13","26","16"], 0, "20 + 3 = 23."],
        ["30 ÷ 5 × 3", ["2","6","18","15"], 2, "6 × 3 = 18."],
        ["100 ÷ (5 × 4)", ["5","10","20","25"], 0, "100 ÷ 20 = 5."]
    ]
};

let questions = questionBank[chapter] || [];

const quiz = document.getElementById("quiz");

if (questions.length === 0) {
    quiz.innerHTML = `
        <div class="question">
            <h3>Question bank coming soon!</h3>
            <p>Questions for ${chapter} have not been added yet.</p>
            <p>Please select BODMAS Rule to try the starter test.</p>
            <a class="back" href="chapters.html?section=${encodeURIComponent(section)}">
                Back to Chapters
            </a>
        </div>`;
    document.getElementById("submitBtn").style.display = "none";
    document.querySelector(".timer").style.display = "none";
} else {
    questions.forEach((q, i) => {
        let html = `
        <div class="question">
            <h3>Question ${i+1}. ${q[0]}</h3>`;

        q[1].forEach((option, j) => {
            html += `
            <label class="option">
                <input type="radio" name="q${i}" value="${j}">
                ${String.fromCharCode(65+j)}. ${option}
            </label>`;
        });

        html += `</div>`;
        quiz.innerHTML += html;
    });
}

let timeLeft = 20 * 60;
let submitted = false;

const timerDisplay = document.getElementById("timer");

const countdown = setInterval(() => {
    if (submitted || questions.length === 0) {
        clearInterval(countdown);
        return;
    }

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerDisplay.textContent =
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0");

    if (timeLeft <= 0) {
        submitTest();
        return;
    }

    timeLeft--;
}, 1000);

function submitTest() {
    if (submitted || questions.length === 0) return;

    submitted = true;
    clearInterval(countdown);

    let score = 0;
    let review = "";

    questions.forEach((q, i) => {
        const selected = document.querySelector(
            `input[name="q${i}"]:checked`
        );

        const answer = selected ? Number(selected.value) : -1;

        if (answer === q[2]) score++;

        review += `
        <div class="explanation">
            <h3>Question ${i+1}</h3>
            <p>${q[0]}</p>
            <p>Your answer: ${
                answer === -1 ? "Not answered" : q[1][answer]
            }</p>
            <p>Correct answer: <strong>${q[1][q[2]]}</strong></p>
            <p>Explanation: ${q[3]}</p>
        </div>`;
    });

    document.getElementById("quiz").style.display = "none";
    document.getElementById("submitBtn").style.display = "none";

    const result = document.getElementById("result");
    result.style.display = "block";

    result.innerHTML = `
        <h2 style="color:#5eead4">Test Completed!</h2>
        <h1>${score} / ${questions.length}</h1>
        <p>Correct answers: ${score}</p>
        <p>Incorrect or unanswered: ${questions.length-score}</p>
        <h2>Answer Review</h2>
        ${review}
        <button class="submit-btn" onclick="location.reload()">
            Try Again
        </button>
        <br><br>
        <a class="back" href="chapters.html?section=${encodeURIComponent(section)}">
            Back to Chapters
        </a>
    `;
}
</script>
</body>
</html>
