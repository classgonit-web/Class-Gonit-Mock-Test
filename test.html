
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Gonit - Mock Test</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 font-family:Arial,sans-serif;
 background:#071426;color:white;
}
.container{
 max-width:700px;margin:20px auto;
 background:#10243c;padding:22px;
 border-radius:18px;
 box-shadow:0 8px 30px #0005;
}
h1{text-align:center;color:#36dfc0}
.top{
 display:flex;justify-content:space-between;
 gap:10px;flex-wrap:wrap;
 margin:15px 0;
}
.timer{
 background:#193d59;padding:12px;
 border-radius:10px;color:#ffd166;
 font-weight:bold;
}
.progress{
 height:9px;background:#29415a;
 border-radius:10px;overflow:hidden;
 margin:15px 0;
}
#bar{height:100%;width:0%;background:#36dfc0}
#question{font-size:20px;line-height:1.5;margin:25px 0}
.option{
 display:block;width:100%;text-align:left;
 padding:14px;margin:10px 0;
 background:#193d59;color:white;
 border:2px solid transparent;
 border-radius:10px;font-size:16px;
 cursor:pointer;
}
.option.selected{border-color:#36dfc0;background:#20516a}
button{
 padding:13px 20px;border:0;border-radius:10px;
 background:#36dfc0;color:#071426;
 font-weight:bold;font-size:15px;cursor:pointer;
}
button:disabled{opacity:.4}
.navigation{
 display:flex;justify-content:space-between;
 gap:10px;margin-top:25px;
}
#result{display:none;text-align:center}
.small{color:#b8c9d9}
@media(max-width:480px){
 .container{padding:16px;margin:5px auto}
 #question{font-size:18px}
 button{padding:12px 14px}
}
</style>
</head>
<body>
<div class="container">
<h1>ক্লাস গণিত 🎓</h1>
<p style="text-align:center" class="small">Math Mock Test</p>

<div id="testArea">
 <div class="top">
  <div id="count" class="timer">Question 1 / 20</div>
  <div id="timer" class="timer">20:00</div>
 </div>

 <div class="progress"><div id="bar"></div></div>

 <div id="question"></div>
 <div id="options"></div>

 <div class="navigation">
  <button id="previous" onclick="previousQuestion()">Previous</button>
  <button id="next" onclick="nextQuestion()">Next</button>
 </div>
 <button onclick="submitTest()" style="width:100%;margin-top:18px;background:#ffc857">
 Submit Test
 </button>
</div>

<div id="result">
 <h2>Test Completed!</h2>
 <h1 id="score"></h1>
 <p id="details"></p>
 <button onclick="location.reload()">Try Again</button>
</div>
</div>

<script>
// Replace these sample questions with your own questions.
const questions = [
{q:"Simplify: 10 + 5 × 2",o:["30","20","25","15"],a:1,e:"Multiplication first: 10 + 10 = 20."},
{q:"Simplify: 20 ÷ 5 + 3",o:["7","4","8","5"],a:0,e:"20 ÷ 5 + 3 = 4 + 3 = 7."},
{q:"What is 12 × 4?",o:["36","48","44","52"],a:1,e:"12 × 4 = 48."},
{q:"What is 100 ÷ 10?",o:["5","20","10","15"],a:2,e:"100 ÷ 10 = 10."},
{q:"Simplify: 8 + 4 × 3",o:["36","20","24","18"],a:1,e:"8 + 12 = 20."},
{q:"What is 15 + 25?",o:["35","45","40","50"],a:2,e:"15 + 25 = 40."},
{q:"What is 9 × 9?",o:["72","81","90","99"],a:1,e:"9 × 9 = 81."},
{q:"What is 144 ÷ 12?",o:["10","11","12","14"],a:2,e:"144 ÷ 12 = 12."},
{q:"Simplify: 30 - 5 × 4",o:["100","10","20","25"],a:1,e:"30 - 20 = 10."},
{q:"What is 7²?",o:["14","21","49","42"],a:2,e:"7 × 7 = 49."},
{q:"What is 50% of 200?",o:["50","100","150","200"],a:1,e:"50% of 200 = 100."},
{q:"What is 3/4 of 100?",o:["25","50","75","80"],a:2,e:"100 × 3/4 = 75."},
{q:"What is the HCF of 12 and 18?",o:["2","3","6","9"],a:2,e:"The HCF is 6."},
{q:"What is the LCM of 4 and 6?",o:["8","10","12","24"],a:2,e:"The LCM is 12."},
{q:"What is 25 × 4?",o:["50","75","100","125"],a:2,e:"25 × 4 = 100."},
{q:"Simplify: 18 + 12 ÷ 3",o:["10","22","30","15"],a:1,e:"18 + 4 = 22."},
{q:"What is the square root of 64?",o:["6","7","8","9"],a:2,e:"8 × 8 = 64."},
{q:"What is 1/2 + 1/2?",o:["1/2","1","2","0"],a:1,e:"1/2 + 1/2 = 1."},
{q:"What is 11 × 11?",o:["111","121","131","101"],a:1,e:"11 × 11 = 121."},
{q:"What is 1000 - 250?",o:["650","700","750","800"],a:2,e:"1000 - 250 = 750."}
];

let current=0;
let answers=Array(questions.length).fill(null);
let remaining=1200;
let finished=false;

function showQuestion(){
 const q=questions[current];
 document.getElementById("count").textContent=
 "Question "+(current+1)+" / "+questions.length;
 document.getElementById("question").textContent=q.q;
 document.getElementById("bar").style.width=
 ((current+1)/questions.length*100)+"%";

 const box=document.getElementById("options");
 box.innerHTML="";
 q.o.forEach((option,i)=>{
  const b=document.createElement("button");
  b.className="option"+(answers[current]===i?" selected":"");
  b.textContent=String.fromCharCode(65+i)+". "+option;
  b.onclick=()=>{
   answers[current]=i;
   showQuestion();
  };
  box.appendChild(b);
 });

 document.getElementById("previous").disabled=current===0;
 document.getElementById("next").disabled=current===questions.length-1;
 document.getElementById("next").textContent=
 current===questions.length-1?"Last Question":"Next";
}

function nextQuestion(){
 if(current<questions.length-1){current++;showQuestion();}
}
function previousQuestion(){
 if(current>0){current--;showQuestion();}
}
function submitTest(){
 if(finished)return;
 if(!confirm("Are you sure you want to submit the test?"))return;
 finishTest();
}
function finishTest(){
 finished=true;
 clearInterval(clock);
 let score=0;
 questions.forEach((q,i)=>{if(answers[i]===q.a)score++;});
 document.getElementById("testArea").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("score").textContent=
 score+" / "+questions.length;
 document.getElementById("details").textContent=
 "Correct: "+score+" | Incorrect: "+
 answers.filter((a,i)=>a!==null&&a!==questions[i].a).length+
 " | Not answered: "+answers.filter(a=>a===null).length;
}
function updateTimer(){
 remaining--;
 let m=Math.floor(remaining/60);
 let s=remaining%60;
 document.getElementById("timer").textContent=
 String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 if(remaining<=0)finishTest();
}
showQuestion();
const clock=setInterval(updateTimer,1000);
</script>
</body>
</html>
