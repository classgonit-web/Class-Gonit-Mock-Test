
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Gonit - Mock Test</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#071426;
 color:#fff;
 padding:15px;
}
.container{
 max-width:750px;
 margin:20px auto;
 background:#10243c;
 padding:22px;
 border-radius:18px;
 box-shadow:0 8px 30px #0005;
}
.header{text-align:center;margin-bottom:20px}
.logo{
 width:75px;height:75px;object-fit:contain;
 border-radius:50%;
}
h1{color:#35d6c0;margin:8px 0}
.subtitle{color:#b8c8dc}
.info{
 display:flex;justify-content:space-between;
 gap:10px;flex-wrap:wrap;margin:20px 0;
}
.info span{
 background:#1b3654;padding:10px 14px;
 border-radius:9px;color:#35d6c0;
 font-weight:bold;
}
.progress{
 height:9px;background:#263d57;
 border-radius:20px;overflow:hidden;
 margin:15px 0 25px;
}
.progress-bar{
 height:100%;width:0;background:#35d6c0;
 transition:.3s;
}
.question{
 font-size:20px;font-weight:bold;
 line-height:1.5;margin-bottom:20px;
}
.option{
 display:block;width:100%;text-align:left;
 padding:14px;margin:10px 0;
 background:#1b3654;color:white;
 border:2px solid transparent;
 border-radius:10px;font-size:16px;
 cursor:pointer;
}
.option.selected{
 border-color:#35d6c0;
 background:#174b50;
}
.option:disabled{cursor:default}
.buttons{
 display:flex;gap:10px;flex-wrap:wrap;
 margin-top:22px;
}
button,.home-button{
 border:0;padding:13px 18px;
 border-radius:9px;font-size:15px;
 font-weight:bold;cursor:pointer;
}
.primary{background:#35d6c0;color:#071426}
.secondary{background:#294766;color:white}
.submit{background:#ffbd59;color:#172033}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
.result{text-align:center}
.score{
 font-size:48px;font-weight:bold;
 color:#35d6c0;margin:15px;
}
.result-card{
 background:#1b3654;padding:15px;
 border-radius:12px;margin:10px 0;
}
.home-button{
 display:inline-block;
 background:#70a1ff;color:#071426;
 text-decoration:none;
}
.review-item{
 background:#1b3654;padding:15px;
 margin:15px 0;border-radius:12px;
 line-height:1.6;
}
.correct{color:#48e69a;font-weight:bold}
.wrong{color:#ff7777;font-weight:bold}
.explanation{color:#c5d4e7;margin-top:8px}
@media(max-width:480px){
 .container{padding:16px;margin:5px auto}
 .question{font-size:18px}
 button,.home-button{flex:1;text-align:center}
 .info span{font-size:13px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<img src="logo.png" alt="Class Gonit Logo" class="logo">
<h1>ক্লাস গণিত 🎓</h1>
<div class="subtitle">Mock Test • Learn • Practice • Succeed</div>
</div>

<div id="testArea">

<div class="info">
<span id="questionCount">Question 1 / 20</span>
<span id="timer">20:00</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="question" id="question"></div>
<div id="options"></div>

<div class="buttons">
<button class="secondary" id="prevBtn" onclick="previousQuestion()">← Previous</button>
<button class="primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
<button class="submit" onclick="submitTest()">Submit Test</button>
</div>
</div>

<div id="resultArea" class="result hidden">
<h1>🎉 Test Completed!</h1>
<div class="score" id="score"></div>
<p id="percentage"></p>

<div class="result-card">
Correct Answers: <b id="correctCount"></b>
</div>
<div class="result-card">
Wrong Answers: <b id="wrongCount"></b>
</div>
<div class="result-card">
Skipped Questions: <b id="skippedCount"></b>
</div>

<div class="buttons">
<button class="primary" onclick="showReview()">📖 Review Answers</button>
<button class="submit" onclick="location.reload()">↻ Try Again</button>
<a href="index.html" class="home-button">🏠 Back to Home</a>
</div>
</div>

<div id="reviewArea" class="hidden">
<h1>📖 Answer Review</h1>
<div id="reviewList"></div>
<div class="buttons">
<a href="index.html" class="home-button">🏠 Back to Home</a>
<button class="submit" onclick="location.reload()">↻ Try Again</button>
</div>
</div>

</div>

<script>
const questions = [
{q:"What is 25 + 35?",o:["50","60","65","70"],a:1,e:"25 + 35 = 60."},
{q:"What is 100 - 45?",o:["45","50","55","65"],a:2,e:"100 - 45 = 55."},
{q:"What is 12 × 8?",o:["86","96","108","88"],a:1,e:"12 × 8 = 96."},
{q:"What is 144 ÷ 12?",o:["10","11","12","14"],a:2,e:"144 ÷ 12 = 12."},
{q:"What is 15 + 20 × 2?",o:["70","55","50","40"],a:1,e:"Multiplication first: 15 + 40 = 55."},
{q:"What is 7 × 9?",o:["56","63","72","69"],a:1,e:"7 × 9 = 63."},
{q:"What is 200 ÷ 5?",o:["20","30","40","50"],a:2,e:"200 ÷ 5 = 40."},
{q:"What is 18 + 27?",o:["35","40","45","55"],a:2,e:"18 + 27 = 45."},
{q:"What is 11 × 11?",o:["111","121","131","101"],a:1,e:"11 × 11 = 121."},
{q:"What is 90 - 38?",o:["42","52","62","48"],a:1,e:"90 - 38 = 52."},
{q:"What is 50% of 200?",o:["50","75","100","150"],a:2,e:"50% of 200 = 100."},
{q:"What is 3²?",o:["6","8","9","12"],a:2,e:"3² = 3 × 3 = 9."},
{q:"What is 5 × (4 + 2)?",o:["20","25","30","35"],a:2,e:"First 4 + 2 = 6, then 5 × 6 = 30."},
{q:"What is 1/2 of 80?",o:["20","30","40","50"],a:2,e:"80 ÷ 2 = 40."},
{q:"What is 75 + 25?",o:["90","95","100","110"],a:2,e:"75 + 25 = 100."},
{q:"What is 8 × 7?",o:["54","56","64","48"],a:1,e:"8 × 7 = 56."},
{q:"What is 120 ÷ 10?",o:["10","11","12","15"],a:2,e:"120 ÷ 10 = 12."},
{q:"What is 36 + 44?",o:["70","75","80","85"],a:2,e:"36 + 44 = 80."},
{q:"What is 9²?",o:["18","72","81","99"],a:2,e:"9² = 81."},
{q:"What is 1000 - 375?",o:["525","625","675","725"],a:1,e:"1000 - 375 = 625."}
];

let current=0;
let answers=Array(questions.length).fill(null);
let timeLeft=20*60;
let finished=false;
let timerInterval;

function showQuestion(){
 const q=questions[current];
 document.getElementById("questionCount").textContent=
 "Question "+(current+1)+" / "+questions.length;
 document.getElementById("question").textContent=q.q;

 const options=document.getElementById("options");
 options.innerHTML="";

 q.o.forEach((option,index)=>{
  const btn=document.createElement("button");
  btn.className="option"+(answers[current]===index?" selected":"");
  btn.textContent=String.fromCharCode(65+index)+". "+option;
  btn.onclick=()=>{
   answers[current]=index;
   showQuestion();
  };
  options.appendChild(btn);
 });

 document.getElementById("prevBtn").disabled=current===0;
 document.getElementById("nextBtn").disabled=current===questions.length-1;
 document.getElementById("progressBar").style.width=
 ((current+1)/questions.length*100)+"%";
}

function nextQuestion(){
 if(current<questions.length-1){current++;showQuestion();}
}
function previousQuestion(){
 if(current>0){current--;showQuestion();}
}

function startTimer(){
 timerInterval=setInterval(()=>{
  if(finished)return;
  timeLeft--;
  let min=Math.floor(timeLeft/60);
  let sec=timeLeft%60;
  document.getElementById("timer").textContent=
  String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");

  if(timeLeft<=0){
   submitTest();
  }
 },1000);
}

function submitTest(){
 if(finished)return;
 if(!confirm("Are you sure you want to submit your test?"))return;

 finished=true;
 clearInterval(timerInterval);

 let correct=0,wrong=0,skipped=0;
 answers.forEach((answer,i)=>{
  if(answer===null)skipped++;
  else if(answer===questions[i].a)correct++;
  else wrong++;
 });

 let percent=Math.round(correct/questions.length*100);

 document.getElementById("testArea").classList.add("hidden");
 document.getElementById("resultArea").classList.remove("hidden");

 document.getElementById("score").textContent=
 correct+" / "+questions.length;
 document.getElementById("percentage").textContent=
 "Your Score: "+percent+"%";
 document.getElementById("correctCount").textContent=correct;
 document.getElementById("wrongCount").textContent=wrong;
 document.getElementById("skippedCount").textContent=skipped;
}

function showReview(){
 document.getElementById("resultArea").classList.add("hidden");
 document.getElementById("reviewArea").classList.remove("hidden");

 const list=document.getElementById("reviewList");
 list.innerHTML="";

 questions.forEach((q,i)=>{
  let selected=answers[i];
  let isCorrect=selected===q.a;

  let html=`
  <div class="review-item">
  <b>Q${i+1}. ${q.q}</b><br>`;

  q.o.forEach((option,j)=>{
   let label=String.fromCharCode(65+j)+". "+option;
   if(j===q.a){
    html+=`<div class="correct">✓ ${label} (Correct Answer)</div>`;
   }else if(j===selected){
    html+=`<div class="wrong">✗ ${label} (Your Answer)</div>`;
   }else{
    html+=`<div>${label}</div>`;
   }
  });

  if(selected===null){
   html+=`<div class="wrong">Not Answered</div>`;
  }

  html+=`<div class="explanation">Explanation: ${q.e}</div></div>`;
  list.innerHTML+=html;
 });
}

showQuestion();
startTimer();
</script>

</body>
</html>
